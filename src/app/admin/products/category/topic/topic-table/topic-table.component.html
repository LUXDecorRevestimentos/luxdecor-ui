<h1>Topico</h1>
<div class="container">    
    <table mat-table [dataSource]="topics">
        <ng-container matColumnDef="topic_id">
            <th mat-header-cell *matHeaderCellDef> TopicoId </th>
            <td mat-cell *matCellDef="let topics"> {{topics.topic_id}} </td>
        </ng-container>

        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef> Nome </th>
            <td mat-cell *matCellDef="let topics"> {{topics.title}} </td>
        </ng-container>

        <ng-container matColumnDef="topic_type">
            <th mat-header-cell *matHeaderCellDef> Tipo </th>
            <td mat-cell *matCellDef="let topics"> {{ getLabelStatus(topics.topic_type)}} </td>
        </ng-container>

        <ng-container matColumnDef="items">
            <th mat-header-cell *matHeaderCellDef> Items </th>
            <td mat-cell *matCellDef="let topics"> {{topics.items}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let topics; columns: displayedColumns;" 
            (click)="onRowClicked(topics)" 
            [ngClass]="{'custom-row': true, 'selected-row': 
            selectedRow?.topic_id === topics.topic_id}"
        ></tr>
        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [colSpan]="displayedColumns.length">
              Nenhuma Topico encontrada
            </td>
        </tr>
    </table>
</div>
