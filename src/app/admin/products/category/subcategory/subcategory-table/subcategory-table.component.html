<h1>SubCategorias</h1>
<div class="container">    
    <table mat-table [dataSource]="subCategories">
        <ng-container matColumnDef="subcategory_id">
            <th mat-header-cell *matHeaderCellDef> SubCategoriaId </th>
            <td mat-cell *matCellDef="let subCategory"> {{subCategory.subcategory_id}} </td>
        </ng-container>

        <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef> Titulo </th>
            <td mat-cell *matCellDef="let subCategory"> {{subCategory.title}} </td>
        </ng-container>
   
        <ng-container matColumnDef="item">
            <th mat-header-cell *matHeaderCellDef> Items </th>
            <td mat-cell *matCellDef="let subCategory"> {{subCategory.item}}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let subCategory; columns: displayedColumns;" 
            (click)="onRowClicked(subCategory)" 
            [ngClass]="{'custom-row': true, 'selected-row': 
            selectedRow?.subcategory_id === subCategory.subcategory_id}"
        ></tr>

        <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell" [colSpan]="displayedColumns.length">
              Nenhuma SubCategoria encontrada
            </td>
        </tr>
    </table>
</div>
