<h1>Instalacao</h1>

<div class="container">
  <table mat-table [dataSource]="dataSource" aria-label="Lista de Instalacoes">

    <ng-container matColumnDef="installation_id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let installation"> {{installation.installation_id}} </td>
    </ng-container>

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Instalacao </th>
      <td mat-cell *matCellDef="let installation"> {{installation.title}} </td>
    </ng-container>

    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef> Preco </th>
      <td mat-cell *matCellDef="let installation"> {{installation.price}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr mat-row 
        *matRowDef="let installation; columns: displayedColumns;" 
        (click)="onRowClicked(installation)"
        [ngClass]="{'selected-row': selectedRow?.installation_id === installation.installation_id}">
    </tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [colSpan]="displayedColumns.length">
        Nenhuma instalacao encontrada
      </td>
    </tr>
  </table>
</div>
