<div class="container">
    <div class="header">
        <h1>Gerenciar</h1>
        <mat-icon class="icon">admin_panel_settings</mat-icon>
    </div>
    <div class="top" *ngIf="managers">
        <app-manager-table [detailTable]="managers" (rowSelected)="onRowSelectedManager($event)"></app-manager-table>
    </div>
    <div class="btn-options">
        <button (click)="handleButtonClick('add')"
        [ngClass]="{'active-button': addOp}">
            <h1>Adicionar</h1>
            <mat-icon class="icon">add</mat-icon> 
        </button>
        <button (click)="handleButtonClick('edit')"
        [ngClass]="{'active-button': editOp}">
            <h1>Editar</h1>
            <mat-icon class="icon">edit</mat-icon>
        </button>
    </div>
    <div class="bottom" *ngIf="adminInfo">
        <app-manager-card [adminInfo]="adminInfo" (updateAdmin)="onUpdateManager($event)"></app-manager-card>
    </div>
</div>
