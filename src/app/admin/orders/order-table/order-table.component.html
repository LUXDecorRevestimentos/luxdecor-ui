<h1>Detalhes dos Pedidos</h1>
<div class="search">
    <mat-icon class="search-icon">search</mat-icon>
    <input (keyup)="applyFilter($event)" />
</div>
<h1>Compras</h1>
<div class="container" *ngIf="dataSource">    
    <table mat-table [dataSource]="dataSource">
        <!-- Cart ID Column -->
        <ng-container matColumnDef="cartId">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Carrinho ID </th>
            <td mat-cell *matCellDef="let order"> {{order.cartId }} </td>
        </ng-container>

        <!-- Customer Name Column -->
        <ng-container matColumnDef="customerName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Comprador </th>
            <td mat-cell *matCellDef="let order"> {{order.customerName }} </td>
        </ng-container>

        <!-- Total Price Column -->
        <ng-container matColumnDef="totalPrice">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Total </th>
            <td mat-cell *matCellDef="let order"> R$
                {{order.totalPrice}} 
            </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef> Status </th>
            <td mat-cell *matCellDef="let order"> 
                <app-order-status [orderStatus]="order.status"></app-order-status>
            </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="data">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Atualizado em </th>
            <td mat-cell *matCellDef="let order">
                {{ (order.data | date:'dd/MM/yyyy') }}  
            </td>
        </ng-container>

        <!-- Header and Row Definitions -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"
            (click)="onRowClicked(row)"
            [ngClass]="{'custom-row': true, 'selected-row': selectedRow === row}"
        >
        </tr>
    </table>
</div>
