<h1>Taxas</h1>
<div class="search">
    <mat-icon class="search-icon">search</mat-icon>
    <input class="input-text" type="text" placeholder="Pesquisar por nome do cliente" (keyup)="applyFilter($event)" />
</div>
<div class="content">    
    <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="payment_method">
            <th mat-header-cell *matHeaderCellDef> VendaId </th>
            <td mat-cell *matCellDef="let tax"> {{tax.payment_method}} </td>
        </ng-container>

        <ng-container matColumnDef="created_at">
            <th mat-header-cell *matHeaderCellDef> Criado </th>
            <td mat-cell *matCellDef="let tax"> {{tax.created_at}} </td>
        </ng-container>

        <ng-container matColumnDef="rate_percentage">
            <th mat-header-cell *matHeaderCellDef> Porcentage (%) </th>
            <td mat-cell *matCellDef="let tax"> {{tax.rate_percentage}} </td>
        </ng-container>

        <ng-container matColumnDef="range_criteria">
            <th mat-header-cell *matHeaderCellDef> Criterio </th>
            <td mat-cell *matCellDef="let tax">{{tax.range_criteria}} </td>
        </ng-container>

        <ng-container matColumnDef="range_start">
            <th mat-header-cell *matHeaderCellDef> Inicio </th>
            <td mat-cell *matCellDef="let tax"> {{tax.range_start}} </td>
        </ng-container>


        <ng-container matColumnDef="range_end">
            <th mat-header-cell *matHeaderCellDef> Fim </th>
            <td mat-cell *matCellDef="let tax"> {{tax.range_end}} </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let taxs; columns: displayedColumns;" 
            (click)="onRowClicked(taxs)" 
            [ngClass]="{'custom-row': true, 'selected-row': selectedRow === taxs}"
        ></tr>
    </table>
</div>
