
<div class="container">
  <div class="return">
    <app-btn-continue></app-btn-continue>
  </div>

  <div class="content">
    <div class="products">
      <div class="top">
        <h1>No Carrinho ({{ cart().items?.length }})</h1>
        <mat-checkbox
            [checked]="cart().completed"
            [indeterminate]="partiallyComplete()"
            (change)="update($event.checked)"
          >
            {{cart().id}}
          </mat-checkbox>
      </div>
      <app-bar [type]="'long'"></app-bar>
      @for (item of cart().items; track item; let i = $index) {
          <app-cart-card 
            [cart]="item"
            [checked]="item.select"
            (checkChange)="update($event, i)"
            (orderUpdate)="onOrderUpdate($event)"
            (orderRemove)="onOrderRemove($event)"
            [display]="true"
          ></app-cart-card>
      }
    </div>
    <div class="subtotal">
      <h1>Resumo do pedido</h1>
      <app-bar [type]="'long'"></app-bar>
      <div class="value-container">
          <p>Produtos</p>
          <p><strong>R$ {{ product_total }}</strong></p>
      </div>
      <app-bar [type]="'long'"></app-bar>
        <div class="value-container" *ngIf="delivery_total">
            <h1>Frete: R$ {{delivery_total}}</h1>
        </div>
        <div class="value-container" *ngIf="!delivery_total">
            <h1>Não conseguimos atender esse local por enquanto.</h1>
        </div>
      <app-bar [type]="'long'"></app-bar>
      <div class="btn-container">
        <app-btn-next (click)="navigateToPayment()"></app-btn-next>
        <app-btn-clean></app-btn-clean>
      </div>
  </div>
  </div>

</div>
