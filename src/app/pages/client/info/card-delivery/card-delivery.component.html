<div class="delivery-card" *ngIf="clientData" >
    <div class="field">
        <span class="label">{{ clientData.address.street }}, {{ clientData.address.number }}</span>
    </div>
    <div class="field">
        <span class="label">São Paulo - SP</span>
        <span class="value">CEP: {{ clientData.address.postal_code }}</span>
    </div>
    <div class="btns">
        <button class="btn" (click)="openModal()">
            Editar
        </button>
    </div>
  </div>
