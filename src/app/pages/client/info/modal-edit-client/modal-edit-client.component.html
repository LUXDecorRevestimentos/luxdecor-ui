<div class="card">
  <form *ngIf="formGroup" [formGroup]="formGroup" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Nome</label>
      <input type="text" formControlName="name" placeholder="Nome">
      <small *ngIf="name?.invalid && name?.touched">
        Nome inválido (apenas letras)
      </small>
    </div>

    <div class="form-group">
      <label>Sobrenome</label>
      <input type="text" formControlName="surname" placeholder="Sobrenome">
      <small *ngIf="surname?.invalid && surname?.touched">
        Sobrenome inválido (apenas letras)
      </small>
    </div>

    <div class="form-group">
      <label>Data de Nascimento</label>
      <input type="date" formControlName="birth_date">
      <small *ngIf="birth_date?.invalid && birth_date?.touched">
        Data obrigatória
      </small>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="email@exemplo.com">
      <small *ngIf="email?.invalid && email?.touched">
        Email inválido
      </small>
    </div>

    <div class="form-group">
      <label>Telefone</label>
      <input type="text" formControlName="phone" mask="(00) 00000-0000" placeholder="(99) 99999-9999">
      <small *ngIf="phone?.invalid && phone?.touched">
        Telefone obrigatório
      </small>
    </div>

    <div class="form-group">
      <label>RG</label>
      <input type="text" formControlName="rg" placeholder="RG">
      <small *ngIf="rg?.invalid && rg?.touched">
        RG obrigatório
      </small>
    </div>

    <div class="form-group">
      <label>CPF</label>
      <input type="text" formControlName="cpf" mask="000.000.000-00" placeholder="000.000.000-00">
      <small *ngIf="cpf?.invalid && cpf?.touched">
        CPF obrigatório
      </small>
    </div>

    <button type="submit" 
    (click)="onSubmit()">Salvar</button>
  </form>
</div>
