<div class="container">
    <div class="shiping-card"
        *ngIf="shouldShowInForcedMode('entrega')"
        [ngClass]="{
            'active-button': isActive('entrega'),
            'disabled-card': !deliveryPrice,
            'forced-selection': isForcedMode()
        }"
        (click)="selectMethod('entrega')">
        <div class="card-content">
            <div class="top" *ngIf="deliveryPrice">
                <h1>Frete: R$ {{deliveryPrice}}</h1>
            </div>
            <div class="top" *ngIf="!deliveryPrice">
                <h1>Não conseguimos atender esse local por enquanto.</h1>
            </div>
            <div class="bottom">    
                <h1>Data de Entrega: Entraremos em contato</h1>    
            </div>
            <div *ngIf="isForcedMode() && deliveryMethod" class="forced-indicator">
                Método Selecionado
            </div>
        </div>
    </div>
    
    <div class="shiping-card"
        *ngIf="shouldShowInForcedMode('retirada')"
        [ngClass]="{
            'active-button': isActive('retirada'),
            'only-option': !deliveryPrice,
            'forced-selection': isForcedMode()
        }"
        (click)="selectMethod('retirada')">
        <div class="card-content">
            <div class="top">
                <h1>Retirada</h1>
            </div>
            <div *ngIf="!deliveryPrice" class="bottom">
                (Única opção disponível)
            </div>
            <div *ngIf="isForcedMode() && !deliveryMethod" class="forced-indicator">
                Método Selecionado
            </div>
        </div>
    </div>
</div>
