<div class="page">
  <div class="container">
    
    <app-carousel class="banner"></app-carousel>

    <ng-container *ngIf="!loadingCategories; else categorySkeleton">
      <div *ngIf="cardsCategory.length > 0">
        <app-carousel-cards [cardsCategory]="cardsCategory"></app-carousel-cards>
        <app-bar [title]="'Recomendado'"></app-bar>
      </div>
    </ng-container>

    <ng-container *ngIf="!loadingProducts; else productSkeleton">
      <div *ngIf="cardsProduct.length > 0">
        <app-carousel-cards [cardsProduct]="cardsProduct"></app-carousel-cards>
      </div>
    </ng-container>

    <app-topic [type]="'large'"></app-topic>
    <app-whatsapp [defaultMessage]="'Olá, preciso de ajuda!'"></app-whatsapp>


    <ng-template #categorySkeleton>
      <div class="skeleton-grid">
        <div class="skeleton-card" *ngFor="let i of [1,2,3]"></div>
      </div>
    </ng-template>

    <ng-template #productSkeleton>
      <div class="skeleton-grid">
        <div class="skeleton-card" *ngFor="let i of [1,2,3]"></div>
      </div>
    </ng-template>

  </div>
</div>
