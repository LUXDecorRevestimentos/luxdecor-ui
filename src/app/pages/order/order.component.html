<div class="container">
  <div class="return">
    <app-btn-continue [label]="'Continue Comprando'"></app-btn-continue>
  </div>

  <div class="content">
    <div class="start" *ngIf="!selectedOrder || isDesktopView()">
      <!-- Your existing tab group remains unchanged -->
      <mat-tab-group>
        <mat-tab label="Ver Tudo">
          <div class="items">
            <ng-container *ngFor="let order of orders; let i = index">
              <app-card-order [order]="order" (click)="selectOrder(order)" [class.selected]="order === selectedOrder">
              </app-card-order>
            </ng-container>
          </div>
        </mat-tab>
        <mat-tab label="A caminho">
          <div class="items">
            <ng-container *ngFor="let order of orderUnderway; let i = index">
              <app-card-order [order]="order" (click)="selectOrder(order)" [class.selected]="order === selectedOrder">
              </app-card-order>
            </ng-container>
          </div>
        </mat-tab>
        <mat-tab label="Concluido">
          <div class="items">
            <ng-container *ngFor="let order of orderFinished; let i = index">
              <app-card-order [order]="order" (click)="selectOrder(order)" [class.selected]="order === selectedOrder">
              </app-card-order>
            </ng-container>
          </div>
        </mat-tab>
      </mat-tab-group>  
    </div>
  
    <div class="end-desktop" *ngIf="isDesktopView() || openItem && selectedOrder">
      <app-card-order [order]="selectedOrder"></app-card-order>
      
      <!-- Shipping Status Component -->
      <div class="shipping-container" *ngIf="orderInfoRespone?.status_list">
        <div class="shipping_status">
          <div class="step" [class.active]="isStatusActive('Em Aberto')">
            <h1 class="step-label">Preparação</h1>
            <div class="box">
              <mat-icon class="package">pallet</mat-icon>
            </div>
          </div>
          <div class="step" [class.active]="isStatusActive('Pendente')">
            <h1 class="step-label">Preparação</h1>
            <div class="box">
              <mat-icon class="package">pallet</mat-icon>
            </div>
          </div>
          <div class="step" [class.active]="isStatusActive('Em Trânsito')">
            <h1 class="step-label">A caminho</h1>
            <div class="shipping">
              <mat-icon class="local_shipping">local_shipping</mat-icon>
            </div>
          </div>
          <div class="step" [class.active]="isStatusActive('Entregue')">
            <h1 class="step-label">Entregue</h1>
            <div class="finnaly">
              <mat-icon class="home">home</mat-icon>
            </div>
          </div>
        </div>

        <div class="step-info">
          <div class="vertical-timeline">
            <div class="timeline-container">
              <div class="time-column">
                <div class="item-time" *ngFor="let status of orderInfoRespone?.status_list">
                  <p>{{ status.created | date: "dd MMM 'yy" }}</p>
                  <p>{{ status.created | date: 'HH:mm' }}</p>
                </div>
              </div>
              
              <div class="timeline-line"></div>
              
              <div class="status-column">
                <div class="status-item" 
                     *ngFor="let status of orderInfoRespone?.status_list"
                     [class.completed]="status.status === 'Pendente'"
                     [class.current]="status.status === 'Em Trânsito'"
                     [class.pending]="status.status === 'Entregue'">
                  <div class="status-circle"></div>
                  <div class="status-label">{{ status.status }}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <app-whatsapp
      [defaultMessage]="'Olá, preciso de ajuda!'"
    ></app-whatsapp>
  </div>
</div>
