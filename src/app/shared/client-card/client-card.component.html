<div class="container" *ngIf="clientData">
    <div class="top">
        <h1>{{ clientData.name }} {{ clientData.surname }}</h1>
        <h1>{{ clientData.contact.phone | phoneFormat }}</h1>    </div>
    <div class="bottom">
        <p>{{ clientData.address.street }}, {{ clientData.address.number }}</p>
        <p>{{ clientData.address.city }} - {{ clientData.address.state }}</p>
        <p>{{ clientData.address.postal_code | cepFormat}}</p>
    </div>
</div>
