<div class="card" [routerLink]="['/product']" [queryParams]="{ product: product?.id}">
    <img [src]="product?.imageUrl" 
         [alt]="product?.title || 'Produto sem nome'"
         loading="lazy"
         [ngClass]="{'hidden': product?.imageUrl}"
         class="img-backgroud">
    <div class="text">
        <h3>{{ product?.title }}</h3>
        <p>R$ {{ product?.data?.price }}</p>
    </div>
</div>
